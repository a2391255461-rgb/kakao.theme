name: Build JIWOONG BW V4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y unzip zip
          python3 -m pip install --upgrade pip
          python3 -m pip install pillow rembg onnxruntime

      - name: Extract Mangdaeng base
        shell: bash
        run: |
          set -e

          rm -rf theme
          mkdir theme

          unzip -q mangdaeng.ktheme -d theme

          test -f theme/KakaoTalkTheme.css
          test -d theme/Images

      - name: Build V4 artwork
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          from rembg import remove
          from io import BytesIO
          import os
          import glob
          import math

          IMG = "theme/Images"

          BLACK = (18,18,18,255)
          WHITE = (255,255,255,255)
          CREAM = (252,251,248,255)
          SOFT = (240,240,238,255)
          GRAY = (90,90,90,255)
          LIGHT_LINE = (30,30,30,100)

          # ==========================================================
          # Helpers
          # ==========================================================

          def open_rgba(path):
              return Image.open(path).convert("RGBA")

          def save(im, path):
              im.save(path, "PNG", optimize=True)

          def density(path):
              if "@3x" in path:
                  return 3
              if "@2x" in path:
                  return 2
              return 3

          # ==========================================================
          # Decorations
          # ==========================================================

          def heart(draw, cx, cy, size, color=BLACK, width=3):
              pts = []

              for i in range(101):
                  t = math.pi * 2 * i / 100

                  x = 16 * math.sin(t) ** 3
                  y = (
                      13 * math.cos(t)
                      - 5 * math.cos(2*t)
                      - 2 * math.cos(3*t)
                      - math.cos(4*t)
                  )

                  pts.append((
                      cx + x * size / 32,
                      cy - y * size / 32
                  ))

              draw.line(
                  pts,
                  fill=color,
                  width=width,
                  joint="curve"
              )

          def sparkle(draw, cx, cy, size, color=BLACK, width=3):
              draw.line(
                  (cx, cy-size, cx, cy+size),
                  fill=color,
                  width=width
              )

              draw.line(
                  (
                      cx-size*0.42,
                      cy,
                      cx+size*0.42,
                      cy
                  ),
                  fill=color,
                  width=width
              )

          def clover(draw, cx, cy, size, color=BLACK, width=3):
              r = size * 0.18

              positions = [
                  (-r,-r),
                  ( r,-r),
                  (-r, r),
                  ( r, r)
              ]

              for dx,dy in positions:
                  draw.ellipse(
                      (
                          cx+dx-r,
                          cy+dy-r,
                          cx+dx+r,
                          cy+dy+r
                      ),
                      outline=color,
                      width=width
                  )

              draw.line(
                  (
                      cx,
                      cy+r*1.6,
                      cx+size*.12,
                      cy+size*.46
                  ),
                  fill=color,
                  width=width
              )

          def bow(draw, cx, cy, size, color=BLACK, width=3):
              draw.ellipse(
                  (
                      cx-size*.43,
                      cy-size*.23,
                      cx-size*.04,
                      cy+size*.20
                  ),
                  outline=color,
                  width=width
              )

              draw.ellipse(
                  (
                      cx+size*.04,
                      cy-size*.23,
                      cx+size*.43,
                      cy+size*.20
                  ),
                  outline=color,
                  width=width
              )

              draw.ellipse(
                  (
                      cx-size*.07,
                      cy-size*.07,
                      cx+size*.07,
                      cy+size*.07
                  ),
                  fill=color
              )

          def paw(draw, cx, cy, size, color=BLACK):
              draw.ellipse(
                  (
                      cx-size*.22,
                      cy,
                      cx+size*.22,
                      cy+size*.27
                  ),
                  fill=color
              )

              toes = [
                  (-.28,-.18),
                  (-.09,-.30),
                  (.12,-.30),
                  (.30,-.16)
              ]

              for dx,dy in toes:
                  draw.ellipse(
                      (
                          cx+size*dx-size*.075,
                          cy+size*dy-size*.075,
                          cx+size*dx+size*.075,
                          cy+size*dy+size*.075
                      ),
                      fill=color
                  )

          # ==========================================================
          # Butterfly
          # ==========================================================

          def butterfly(draw, cx, cy, size, width=3):
              outline = BLACK

              blue1 = (158,211,240,255)
              blue2 = (105,176,224,255)

              draw.ellipse(
                  (
                      cx-size*.48,
                      cy-size*.39,
                      cx-size*.03,
                      cy+size*.03
                  ),
                  fill=blue1,
                  outline=outline,
                  width=width
              )

              draw.ellipse(
                  (
                      cx+size*.03,
                      cy-size*.39,
                      cx+size*.48,
                      cy+size*.03
                  ),
                  fill=blue1,
                  outline=outline,
                  width=width
              )

              draw.ellipse(
                  (
                      cx-size*.38,
                      cy,
                      cx-size*.02,
                      cy+size*.34
                  ),
                  fill=blue2,
                  outline=outline,
                  width=width
              )

              draw.ellipse(
                  (
                      cx+size*.02,
                      cy,
                      cx+size*.38,
                      cy+size*.34
                  ),
                  fill=blue2,
                  outline=outline,
                  width=width
              )

              draw.line(
                  (
                      cx,
                      cy-size*.18,
                      cx,
                      cy+size*.27
                  ),
                  fill=outline,
                  width=width
              )

          # ==========================================================
          # Black Cat
          # ==========================================================

          def black_cat(draw, cx, cy, size):
              r = size * .32

              left_ear = [
                  (cx-r*.82, cy-r*.55),
                  (cx-r*.92, cy-r*1.22),
                  (cx-r*.18, cy-r*.82)
              ]

              right_ear = [
                  (cx+r*.82, cy-r*.55),
                  (cx+r*.92, cy-r*1.22),
                  (cx+r*.18, cy-r*.82)
              ]

              draw.polygon(left_ear, fill=BLACK)
              draw.polygon(right_ear, fill=BLACK)

              draw.ellipse(
                  (
                      cx-r,
                      cy-r,
                      cx+r,
                      cy+r
                  ),
                  fill=BLACK
              )

              eye = max(2, int(size*.05))

              for ex in [
                  cx-r*.36,
                  cx+r*.36
              ]:
                  draw.ellipse(
                      (
                          ex-eye,
                          cy-r*.04-eye,
                          ex+eye,
                          cy-r*.04+eye
                      ),
                      fill=(236,197,43,255)
                  )

                  draw.rectangle(
                      (
                          ex-eye*.10,
                          cy-r*.04-eye*.70,
                          ex+eye*.10,
                          cy-r*.04+eye*.70
                      ),
                      fill=BLACK
                  )

          # ==========================================================
          # Penguin
          # ==========================================================

          def penguin(draw, cx, cy, size):
              rw = size*.30
              rh = size*.39

              draw.ellipse(
                  (
                      cx-rw,
                      cy-rh,
                      cx+rw,
                      cy+rh
                  ),
                  fill=BLACK
              )

              draw.ellipse(
                  (
                      cx-rw*.64,
                      cy-rh*.43,
                      cx+rw*.64,
                      cy+rh*.72
                  ),
                  fill=WHITE
              )

              eye = max(2,int(size*.034))

              for ex in [
                  cx-rw*.30,
                  cx+rw*.30
              ]:
                  draw.ellipse(
                      (
                          ex-eye,
                          cy-rh*.30-eye,
                          ex+eye,
                          cy-rh*.30+eye
                      ),
                      fill=BLACK
                  )

              draw.polygon(
                  [
                      (
                          cx-size*.10,
                          cy-rh*.08
                      ),
                      (
                          cx+size*.10,
                          cy-rh*.08
                      ),
                      (
                          cx,
                          cy+size*.07
                      )
                  ],
                  fill=(244,175,38,255)
              )

          # ==========================================================
          # Tiger
          # ==========================================================

          def tiger(draw, cx, cy, size):
              r = size*.32

              orange = (241,151,39,255)

              lw = max(
                  2,
                  int(size*.035)
              )

              draw.ellipse(
                  (
                      cx-r,
                      cy-r,
                      cx+r,
                      cy+r
                  ),
                  fill=orange,
                  outline=BLACK,
                  width=lw
              )

              draw.ellipse(
                  (
                      cx-r*1.02,
                      cy-r*1.04,
                      cx-r*.35,
                      cy-r*.35
                  ),
                  fill=orange,
                  outline=BLACK,
                  width=lw
              )

              draw.ellipse(
                  (
                      cx+r*.35,
                      cy-r*1.04,
                      cx+r*1.02,
                      cy-r*.35
                  ),
                  fill=orange,
                  outline=BLACK,
                  width=lw
              )

              draw.ellipse(
                  (
                      cx-r*.50,
                      cy+r*.03,
                      cx+r*.50,
                      cy+r*.66
                  ),
                  fill=WHITE
              )

              stripe = max(
                  2,
                  int(size*.045)
              )

              for xx in [-.42,0,.42]:
                  draw.line(
                      (
                          cx+r*xx,
                          cy-r*.86,
                          cx+r*xx*.65,
                          cy-r*.33
                      ),
                      fill=BLACK,
                      width=stripe
                  )

              eye = max(
                  2,
                  int(size*.034)
              )

              for ex in [
                  cx-r*.36,
                  cx+r*.36
              ]:
                  draw.ellipse(
                      (
                          ex-eye,
                          cy-r*.08-eye,
                          ex+eye,
                          cy-r*.08+eye
                      ),
                      fill=BLACK
                  )

          # ==========================================================
          # Jiwoong transparent sticker
          # ==========================================================

          HEAD = None
          photo = None

          candidates = [
              "IMG_5895.png",
              "IMG_5895.jpeg",
              "IMG_5895.jpg"
          ]

          for p in candidates:
              if os.path.exists(p):
                  photo = p
                  break

          if photo:
              print("Preparing Jiwoong head...")

              src = open_rgba(photo)
              W,H = src.size

              # 中央戴白色頭巾的人
              crop = src.crop(
                  (
                      int(W*.25),
                      int(H*.01),
                      int(W*.67),
                      int(H*.57)
                  )
              )

              try:
                  result = remove(crop)

                  if isinstance(result, Image.Image):
                      head = result.convert("RGBA")
                  else:
                      head = Image.open(
                          BytesIO(result)
                      ).convert("RGBA")

                  alpha = head.getchannel("A")

                  alpha = alpha.point(
                      lambda a:
                      0 if a < 45 else a
                  )

                  head.putalpha(alpha)

                  bbox = alpha.getbbox()

                  if bbox:
                      head = head.crop(bbox)

                  # 再收窄，只留下頭、頭巾與極少肩膀
                  hw,hh = head.size

                  head = head.crop(
                      (
                          int(hw*.05),
                          0,
                          int(hw*.95),
                          int(hh*.63)
                      )
                  )

                  bbox = head.getchannel("A").getbbox()

                  if bbox:
                      head = head.crop(bbox)

                  HEAD = head

                  save(
                      HEAD,
                      "jiwoong_head_v4.png"
                  )

              except Exception as e:
                  print(
                      "rembg failed:",
                      e
                  )

          # ==========================================================
          # Sticker compositing
          # ==========================================================

          def sticker(base, asset, x, y, border):
              alpha = asset.getchannel("A")

              k = max(
                  3,
                  border*2+1
              )

              if k % 2 == 0:
                  k += 1

              expanded = alpha.filter(
                  ImageFilter.MaxFilter(k)
              )

              outline = Image.new(
                  "RGBA",
                  asset.size,
                  WHITE
              )

              outline.putalpha(expanded)

              base.alpha_composite(
                  outline,
                  (x,y)
              )

              base.alpha_composite(
                  asset,
                  (x,y)
              )

          # ==========================================================
          # MAIN BACKGROUND
          #
          # V4:
          # NO HUGE JIWOONG IMAGE.
          # Only sparse decoration.
          # ==========================================================

          def main_background(path):
              old = open_rgba(path)

              w,h = old.size

              im = Image.new(
                  "RGBA",
                  (w,h),
                  CREAM
              )

              d = ImageDraw.Draw(im)

              lw = max(
                  2,
                  w//420
              )

              s = w/13

              # very sparse decorations only
              heart(
                  d,
                  w*.88,
                  h*.10,
                  s*.40,
                  LIGHT_LINE,
                  lw
              )

              sparkle(
                  d,
                  w*.11,
                  h*.19,
                  s*.26,
                  LIGHT_LINE,
                  lw
              )

              clover(
                  d,
                  w*.88,
                  h*.39,
                  s*.40,
                  LIGHT_LINE,
                  lw
              )

              bow(
                  d,
                  w*.10,
                  h*.63,
                  s*.45,
                  LIGHT_LINE,
                  lw
              )

              sparkle(
                  d,
                  w*.88,
                  h*.78,
                  s*.25,
                  LIGHT_LINE,
                  lw
              )

              heart(
                  d,
                  w*.12,
                  h*.91,
                  s*.38,
                  LIGHT_LINE,
                  lw
              )

              save(im,path)

          # ==========================================================
          # CHATROOM BACKGROUND
          # ==========================================================

          def chat_background(path):
              old = open_rgba(path)

              w,h = old.size

              im = Image.new(
                  "RGBA",
                  (w,h),
                  CREAM
              )

              d = ImageDraw.Draw(im)

              lw = max(
                  2,
                  w//420
              )

              s = w/13

              heart(
                  d,
                  w*.08,
                  h*.13,
                  s*.42,
                  LIGHT_LINE,
                  lw
              )

              sparkle(
                  d,
                  w*.87,
                  h*.16,
                  s*.27,
                  LIGHT_LINE,
                  lw
              )

              clover(
                  d,
                  w*.09,
                  h*.39,
                  s*.43,
                  LIGHT_LINE,
                  lw
              )

              heart(
                  d,
                  w*.88,
                  h*.48,
                  s*.35,
                  LIGHT_LINE,
                  lw
              )

              bow(
                  d,
                  w*.12,
                  h*.68,
                  s*.42,
                  LIGHT_LINE,
                  lw
              )

              butterfly(
                  d,
                  w*.86,
                  h*.77,
                  s*.44,
                  lw
              )

              sparkle(
                  d,
                  w*.11,
                  h*.90,
                  s*.24,
                  LIGHT_LINE,
                  lw
              )

              save(im,path)

          main_path = os.path.join(
              IMG,
              "mainBgImage@3x.png"
          )

          if os.path.exists(main_path):
              main_background(main_path)

          chat_path = os.path.join(
              IMG,
              "chatroomBgImage@3x.png"
          )

          if os.path.exists(chat_path):
              chat_background(chat_path)

          # ==========================================================
          # V4 CHAT BUBBLE
          #
          # Key fixes:
          # - lower ears
          # - much larger corner radius
          # - less empty top space
          # - Jiwoong stays in upper fixed area
          # ==========================================================

          def make_bubble(path):
              source = open_rgba(path)

              w,h = source.size

              name = os.path.basename(path)

              send = "Send" in name
              selected = "Selected" in name
              first = "01" in name

              den = density(path)

              im = Image.new(
                  "RGBA",
                  (w,h),
                  (0,0,0,0)
              )

              d = ImageDraw.Draw(im)

              if send:
                  fill = (
                      (48,48,48,255)
                      if selected
                      else BLACK
                  )

                  edge = fill
              else:
                  fill = (
                      (243,243,243,255)
                      if selected
                      else WHITE
                  )

                  edge = BLACK

              stroke = max(
                  2,
                  den*2
              )

              # IMPORTANT:
              # previous V3 used ~40%.
              # V4 lowers body to only ~27%.
              if first:
                  top = int(h*.27)
              else:
                  top = int(h*.13)

              left = max(
                  den,
                  int(w*.025)
              )

              right = w-left
              bottom = h-max(
                  den,
                  int(h*.025)
              )

              radius = max(
                  12,
                  int(min(w,h)*.25)
              )

              # ==================================================
              # rounded body
              # ==================================================

              d.rounded_rectangle(
                  (
                      left,
                      top,
                      right,
                      bottom
                  ),
                  radius=radius,
                  fill=fill,
                  outline=edge,
                  width=stroke
              )

              # ==================================================
              # LOWER / ROUNDER CAT EARS
              # ==================================================

              ear_h = int(
                  h*.14
                  if first
                  else h*.11
              )

              ear_w = int(w*.19)

              lx = left + radius*.52
              rx = right - radius*.52

              # slightly rounded-looking ears by using a wider base
              left_ear = [
                  (
                      lx,
                      top+stroke
                  ),
                  (
                      lx+ear_w*.46,
                      top-ear_h
                  ),
                  (
                      lx+ear_w,
                      top+stroke
                  )
              ]

              right_ear = [
                  (
                      rx-ear_w,
                      top+stroke
                  ),
                  (
                      rx-ear_w*.46,
                      top-ear_h
                  ),
                  (
                      rx,
                      top+stroke
                  )
              ]

              d.polygon(
                  left_ear,
                  fill=fill
              )

              d.polygon(
                  right_ear,
                  fill=fill
              )

              d.line(
                  left_ear,
                  fill=edge,
                  width=stroke,
                  joint="curve"
              )

              d.line(
                  right_ear,
                  fill=edge,
                  width=stroke,
                  joint="curve"
              )

              # remove bottom ear seam
              d.line(
                  (
                      lx+stroke,
                      top+stroke,
                      lx+ear_w-stroke,
                      top+stroke
                  ),
                  fill=fill,
                  width=stroke+3
              )

              d.line(
                  (
                      rx-ear_w+stroke,
                      top+stroke,
                      rx-stroke,
                      top+stroke
                  ),
                  fill=fill,
                  width=stroke+3
              )

              # ==================================================
              # Jiwoong
              # ==================================================

              if first and HEAD is not None:
                  head = HEAD.copy()

                  head.thumbnail(
                      (
                          int(w*.58),
                          int(h*.35)
                      ),
                      Image.Resampling.LANCZOS
                  )

                  # Keep head mostly above bubble.
                  y = max(
                      0,
                      top-head.height+den
                  )

                  if send:
                      x = (
                          w
                          - head.width
                          - den
                      )
                  else:
                      x = den

                  sticker(
                      im,
                      head,
                      int(x),
                      int(y),
                      max(
                          2,
                          den
                      )
                  )

              save(im,path)

          for p in glob.glob(
              os.path.join(
                  IMG,
                  "chatroomBubble*.png"
              )
          ):
              make_bubble(p)

          # ==========================================================
          # TAB ICONS
          # ==========================================================

          def tab_icon(path):
              old = open_rgba(path)

              w,h = old.size

              name = os.path.basename(path)

              im = Image.new(
                  "RGBA",
                  (w,h),
                  (0,0,0,0)
              )

              d = ImageDraw.Draw(im)

              # slightly smaller than V3
              s = min(w,h)*.78

              if "Friends" in name:
                  penguin(
                      d,
                      w/2,
                      h/2,
                      s
                  )

              elif "Chats" in name:
                  tiger(
                      d,
                      w/2,
                      h/2,
                      s
                  )

              elif "Now" in name or "Call" in name:
                  black_cat(
                      d,
                      w/2,
                      h/2,
                      s
                  )

              elif "Shopping" in name or "Piccoma" in name:
                  butterfly(
                      d,
                      w/2,
                      h/2,
                      s*.82,
                      max(
                          2,
                          int(s*.035)
                      )
                  )

              elif "More" in name and HEAD is not None:
                  hh = HEAD.copy()

                  hh.thumbnail(
                      (
                          int(w*.72),
                          int(h*.72)
                      ),
                      Image.Resampling.LANCZOS
                  )

                  im.alpha_composite(
                      hh,
                      (
                          (w-hh.width)//2,
                          (h-hh.height)//2
                      )
                  )

              else:
                  heart(
                      d,
                      w/2,
                      h/2,
                      s*.52,
                      BLACK,
                      max(
                          2,
                          int(s*.05)
                      )
                  )

              save(im,path)

          for p in glob.glob(
              os.path.join(
                  IMG,
                  "maintabIco*.png"
              )
          ):
              tab_icon(p)

          # ==========================================================
          # TAB BAR
          # ==========================================================

          for p in glob.glob(
              os.path.join(
                  IMG,
                  "maintabBgImage@*.png"
              )
          ):
              old = open_rgba(p)

              w,h = old.size

              im = Image.new(
                  "RGBA",
                  (w,h),
                  WHITE
              )

              d = ImageDraw.Draw(im)

              d.line(
                  (
                      0,
                      1,
                      w,
                      1
                  ),
                  fill=(30,30,30,55),
                  width=max(
                      1,
                      h//45
                  )
              )

              save(im,p)

          # ==========================================================
          # PROFILE PLACEHOLDER
          # ==========================================================

          profile = os.path.join(
              IMG,
              "profileImg01@3x.png"
          )

          if os.path.exists(profile):
              old = open_rgba(profile)

              w,h = old.size

              im = Image.new(
                  "RGBA",
                  (w,h),
                  WHITE
              )

              d = ImageDraw.Draw(im)

              black_cat(
                  d,
                  w/2,
                  h/2,
                  min(w,h)*.76
              )

              save(im,profile)

          print("V4 artwork completed.")
          PY

      - name: Update CSS for V4
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path(
              "theme/KakaoTalkTheme.css"
          )

          css = path.read_text(
              encoding="utf-8",
              errors="ignore"
          )

          # ==========================================================
          # Manifest
          # ==========================================================

          css = re.sub(
              r"-kakaotalk-theme-name:[^;]*;",
              "-kakaotalk-theme-name: 'JIWOONG BW V4';",
              css
          )

          css = re.sub(
              r"-kakaotalk-theme-id:[^;]*;",
              "-kakaotalk-theme-id: 'com.uo.jiwoong.bw.v4';",
              css
          )

          css = re.sub(
              r"-kakaotalk-author-name:[^;]*;",
              "-kakaotalk-author-name: 'UO';",
              css
          )

          # ==========================================================
          # Background palette
          # ==========================================================

          css = css.replace(
              "#FFDEDE",
              "#FCFBF8"
          )

          css = css.replace(
              "#FFFCEE",
              "#FCFBF8"
          )

          css = css.replace(
              "#FFF8DA",
              "#FCFBF8"
          )

          # ==========================================================
          # Send bubble
          #
          # Important:
          # V4 increases left/right padding.
          # This makes short messages wider instead of square.
          # ==========================================================

          send_pattern = (
              r"MessageCellStyle-Send\s*\{.*?\}"
          )

          m = re.search(
              send_pattern,
              css,
              re.S
          )

          if m:
              block = m.group(0)

              block = re.sub(
                  r"-ios-title-edgeinsets:[^;]*;",
                  "-ios-title-edgeinsets: 24px 27px 9px 27px;",
                  block
              )

              block = re.sub(
                  r"-ios-group-title-edgeinsets:[^;]*;",
                  "-ios-group-title-edgeinsets: 10px 27px 9px 27px;",
                  block
              )

              block = re.sub(
                  r"-ios-text-color:[^;]*;",
                  "-ios-text-color: #FFFFFF;",
                  block
              )

              block = re.sub(
                  r"-ios-selected-text-color:[^;]*;",
                  "-ios-selected-text-color: #FFFFFF;",
                  block
              )

              block = re.sub(
                  r"-ios-unread-text-color:[^;]*;",
                  "-ios-unread-text-color: #D8D8D8;",
                  block
              )

              css = (
                  css[:m.start()]
                  + block
                  + css[m.end():]
              )

          # ==========================================================
          # Receive bubble
          # ==========================================================

          receive_pattern = (
              r"MessageCellStyle-Receive\s*\{.*?\}"
          )

          m = re.search(
              receive_pattern,
              css,
              re.S
          )

          if m:
              block = m.group(0)

              block = re.sub(
                  r"-ios-title-edgeinsets:[^;]*;",
                  "-ios-title-edgeinsets: 24px 27px 9px 27px;",
                  block
              )

              block = re.sub(
                  r"-ios-group-title-edgeinsets:[^;]*;",
                  "-ios-group-title-edgeinsets: 10px 27px 9px 27px;",
                  block
              )

              block = re.sub(
                  r"-ios-text-color:[^;]*;",
                  "-ios-text-color: #171717;",
                  block
              )

              block = re.sub(
                  r"-ios-selected-text-color:[^;]*;",
                  "-ios-selected-text-color: #171717;",
                  block
              )

              block = re.sub(
                  r"-ios-unread-text-color:[^;]*;",
                  "-ios-unread-text-color: #777777;",
                  block
              )

              css = (
                  css[:m.start()]
                  + block
                  + css[m.end():]
              )

          path.write_text(
              css,
              encoding="utf-8"
          )

          print("V4 CSS updated.")
          PY

      - name: Package V4
        shell: bash
        run: |
          set -e

          rm -f JIWOONG_BW.ktheme

          cd theme

          zip -q -r ../JIWOONG_BW.ktheme .

          cd ..

          unzip -t JIWOONG_BW.ktheme

          ls -lh JIWOONG_BW.ktheme

      - name: Commit V4
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add JIWOONG_BW.ktheme

          if git diff --cached --quiet; then
            echo "No theme changes."
          else
            git commit -m "Build JIWOONG BW V4"
            git push
          fi