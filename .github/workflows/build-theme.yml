name: Build JIWOONG BW V6

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y unzip zip
          python3 -m pip install --upgrade pip
          python3 -m pip install pillow

      - name: Extract base theme
        shell: bash
        run: |
          set -e
          rm -rf theme
          mkdir theme
          unzip -q mangdaeng.ktheme -d theme
          test -f theme/KakaoTalkTheme.css
          test -d theme/Images

      - name: Generate V6 artwork
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from PIL import Image, ImageDraw
          import os
          import glob
          import math

          IMG = "theme/Images"

          BLACK = (18,18,18,255)
          WHITE = (255,255,255,255)
          CREAM = (253,252,249,255)

          BLUE_LIGHT = (169,218,244,255)
          BLUE = (103,176,225,255)

          # =========================================================
          # BASIC
          # =========================================================

          def rgba(path):
              return Image.open(path).convert("RGBA")

          def save(im,path):
              im.save(path,"PNG",optimize=True)

          def density(path):
              if "@3x" in path:
                  return 3
              if "@2x" in path:
                  return 2
              return 3

          # =========================================================
          # DOODLES
          # =========================================================

          def heart(d,cx,cy,s,c=BLACK,w=3):
              pts=[]

              for i in range(101):
                  t=math.pi*2*i/100

                  x=16*math.sin(t)**3

                  y=(
                      13*math.cos(t)
                      -5*math.cos(2*t)
                      -2*math.cos(3*t)
                      -math.cos(4*t)
                  )

                  pts.append(
                      (
                          cx+x*s/32,
                          cy-y*s/32
                      )
                  )

              d.line(
                  pts,
                  fill=c,
                  width=w,
                  joint="curve"
              )

          def sparkle(d,cx,cy,s,c=BLACK,w=3):
              # diamond-style sparkle
              pts=[
                  (cx,cy-s),
                  (cx+s*.18,cy-s*.18),
                  (cx+s*.48,cy),
                  (cx+s*.18,cy+s*.18),
                  (cx,cy+s),
                  (cx-s*.18,cy+s*.18),
                  (cx-s*.48,cy),
                  (cx-s*.18,cy-s*.18),
                  (cx,cy-s)
              ]

              d.line(
                  pts,
                  fill=c,
                  width=w,
                  joint="curve"
              )

          def clover(d,cx,cy,s,c=BLACK,w=3):
              r=s*.17

              centers=[
                  (cx-r,cy-r),
                  (cx+r,cy-r),
                  (cx-r,cy+r),
                  (cx+r,cy+r)
              ]

              for x,y in centers:
                  d.ellipse(
                      (
                          x-r,
                          y-r,
                          x+r,
                          y+r
                      ),
                      outline=c,
                      width=w
                  )

              d.line(
                  (
                      cx,
                      cy+r*1.65,
                      cx+s*.10,
                      cy+s*.50
                  ),
                  fill=c,
                  width=w
              )

          def bow(d,cx,cy,s,c=BLACK,w=3):
              # central knot
              knot=s*.08

              d.ellipse(
                  (
                      cx-knot,
                      cy-knot,
                      cx+knot,
                      cy+knot
                  ),
                  fill=c
              )

              # left ribbon
              d.line(
                  [
                      (cx-knot,cy),
                      (cx-s*.45,cy-s*.26),
                      (cx-s*.38,cy+s*.22),
                      (cx-knot,cy)
                  ],
                  fill=c,
                  width=w,
                  joint="curve"
              )

              # right ribbon
              d.line(
                  [
                      (cx+knot,cy),
                      (cx+s*.45,cy-s*.26),
                      (cx+s*.38,cy+s*.22),
                      (cx+knot,cy)
                  ],
                  fill=c,
                  width=w,
                  joint="curve"
              )

          # =========================================================
          # BLUE BUTTERFLY
          # =========================================================

          def butterfly(d,cx,cy,s,w=3):

              # upper wings
              d.ellipse(
                  (
                      cx-s*.48,
                      cy-s*.40,
                      cx-s*.03,
                      cy+s*.02
                  ),
                  fill=BLUE_LIGHT,
                  outline=BLACK,
                  width=w
              )

              d.ellipse(
                  (
                      cx+s*.03,
                      cy-s*.40,
                      cx+s*.48,
                      cy+s*.02
                  ),
                  fill=BLUE_LIGHT,
                  outline=BLACK,
                  width=w
              )

              # lower wings
              d.ellipse(
                  (
                      cx-s*.36,
                      cy,
                      cx-s*.02,
                      cy+s*.34
                  ),
                  fill=BLUE,
                  outline=BLACK,
                  width=w
              )

              d.ellipse(
                  (
                      cx+s*.02,
                      cy,
                      cx+s*.36,
                      cy+s*.34
                  ),
                  fill=BLUE,
                  outline=BLACK,
                  width=w
              )

              # body
              d.line(
                  (
                      cx,
                      cy-s*.18,
                      cx,
                      cy+s*.28
                  ),
                  fill=BLACK,
                  width=w
              )

              # antenna
              d.arc(
                  (
                      cx-s*.16,
                      cy-s*.36,
                      cx,
                      cy-s*.08
                  ),
                  180,
                  300,
                  fill=BLACK,
                  width=max(1,w-1)
              )

              d.arc(
                  (
                      cx,
                      cy-s*.36,
                      cx+s*.16,
                      cy-s*.08
                  ),
                  240,
                  360,
                  fill=BLACK,
                  width=max(1,w-1)
              )

          # =========================================================
          # PENGUIN
          # =========================================================

          def penguin(d,cx,cy,s):

              rw=s*.30
              rh=s*.39

              d.ellipse(
                  (
                      cx-rw,
                      cy-rh,
                      cx+rw,
                      cy+rh
                  ),
                  fill=BLACK
              )

              d.ellipse(
                  (
                      cx-rw*.64,
                      cy-rh*.43,
                      cx+rw*.64,
                      cy+rh*.72
                  ),
                  fill=WHITE
              )

              eye=max(2,int(s*.035))

              for ex in [
                  cx-rw*.30,
                  cx+rw*.30
              ]:

                  d.ellipse(
                      (
                          ex-eye,
                          cy-rh*.30-eye,
                          ex+eye,
                          cy-rh*.30+eye
                      ),
                      fill=BLACK
                  )

              d.polygon(
                  [
                      (
                          cx-s*.10,
                          cy-rh*.08
                      ),
                      (
                          cx+s*.10,
                          cy-rh*.08
                      ),
                      (
                          cx,
                          cy+s*.07
                      )
                  ],
                  fill=(245,177,42,255)
              )

          # =========================================================
          # TIGER
          # =========================================================

          def tiger(d,cx,cy,s):

              r=s*.32

              orange=(242,154,42,255)

              lw=max(
                  2,
                  int(s*.035)
              )

              # ears
              d.ellipse(
                  (
                      cx-r*1.03,
                      cy-r*1.05,
                      cx-r*.35,
                      cy-r*.35
                  ),
                  fill=orange,
                  outline=BLACK,
                  width=lw
              )

              d.ellipse(
                  (
                      cx+r*.35,
                      cy-r*1.05,
                      cx+r*1.03,
                      cy-r*.35
                  ),
                  fill=orange,
                  outline=BLACK,
                  width=lw
              )

              # face
              d.ellipse(
                  (
                      cx-r,
                      cy-r,
                      cx+r,
                      cy+r
                  ),
                  fill=orange,
                  outline=BLACK,
                  width=lw
              )

              # muzzle
              d.ellipse(
                  (
                      cx-r*.50,
                      cy+r*.04,
                      cx+r*.50,
                      cy+r*.66
                  ),
                  fill=WHITE
              )

              stripe=max(
                  2,
                  int(s*.045)
              )

              for xx in [-.42,0,.42]:

                  d.line(
                      (
                          cx+r*xx,
                          cy-r*.86,
                          cx+r*xx*.64,
                          cy-r*.33
                      ),
                      fill=BLACK,
                      width=stripe
                  )

              eye=max(
                  2,
                  int(s*.035)
              )

              for ex in [
                  cx-r*.36,
                  cx+r*.36
              ]:

                  d.ellipse(
                      (
                          ex-eye,
                          cy-r*.08-eye,
                          ex+eye,
                          cy-r*.08+eye
                      ),
                      fill=BLACK
                  )

          # =========================================================
          # BLACK CAT
          # =========================================================

          def black_cat(d,cx,cy,s):

              r=s*.32

              left_ear=[
                  (
                      cx-r*.82,
                      cy-r*.55
                  ),
                  (
                      cx-r*.92,
                      cy-r*1.20
                  ),
                  (
                      cx-r*.18,
                      cy-r*.82
                  )
              ]

              right_ear=[
                  (
                      cx+r*.82,
                      cy-r*.55
                  ),
                  (
                      cx+r*.92,
                      cy-r*1.20
                  ),
                  (
                      cx+r*.18,
                      cy-r*.82
                  )
              ]

              d.polygon(
                  left_ear,
                  fill=BLACK
              )

              d.polygon(
                  right_ear,
                  fill=BLACK
              )

              d.ellipse(
                  (
                      cx-r,
                      cy-r,
                      cx+r,
                      cy+r
                  ),
                  fill=BLACK
              )

              eye=max(
                  2,
                  int(s*.05)
              )

              for ex in [
                  cx-r*.36,
                  cx+r*.36
              ]:

                  d.ellipse(
                      (
                          ex-eye,
                          cy-r*.04-eye,
                          ex+eye,
                          cy-r*.04+eye
                      ),
                      fill=(238,198,43,255)
                  )

                  d.rectangle(
                      (
                          ex-eye*.10,
                          cy-r*.04-eye*.70,
                          ex+eye*.10,
                          cy-r*.04+eye*.70
                      ),
                      fill=BLACK
                  )

          # =========================================================
          # MAIN BACKGROUND
          # =========================================================

          def main_background(path):

              src=rgba(path)

              w,h=src.size

              im=Image.new(
                  "RGBA",
                  (w,h),
                  CREAM
              )

              d=ImageDraw.Draw(im)

              lw=max(
                  2,
                  w//450
              )

              s=w/14

              # sparse decorative layout
              sparkle(
                  d,
                  w*.10,
                  h*.13,
                  s*.19,
                  BLACK,
                  lw
              )

              heart(
                  d,
                  w*.89,
                  h*.17,
                  s*.29,
                  BLACK,
                  lw
              )

              clover(
                  d,
                  w*.91,
                  h*.38,
                  s*.30,
                  BLACK,
                  lw
              )

              bow(
                  d,
                  w*.09,
                  h*.60,
                  s*.34,
                  BLACK,
                  lw
              )

              sparkle(
                  d,
                  w*.89,
                  h*.76,
                  s*.17,
                  BLACK,
                  lw
              )

              heart(
                  d,
                  w*.10,
                  h*.91,
                  s*.26,
                  BLACK,
                  lw
              )

              save(im,path)

          # =========================================================
          # CHAT BACKGROUND
          # =========================================================

          def chat_background(path):

              src=rgba(path)

              w,h=src.size

              im=Image.new(
                  "RGBA",
                  (w,h),
                  CREAM
              )

              d=ImageDraw.Draw(im)

              lw=max(
                  2,
                  w//450
              )

              s=w/14

              heart(
                  d,
                  w*.07,
                  h*.11,
                  s*.29,
                  BLACK,
                  lw
              )

              sparkle(
                  d,
                  w*.89,
                  h*.15,
                  s*.17,
                  BLACK,
                  lw
              )

              clover(
                  d,
                  w*.08,
                  h*.35,
                  s*.29,
                  BLACK,
                  lw
              )

              heart(
                  d,
                  w*.90,
                  h*.46,
                  s*.25,
                  BLACK,
                  lw
              )

              bow(
                  d,
                  w*.10,
                  h*.67,
                  s*.31,
                  BLACK,
                  lw
              )

              butterfly(
                  d,
                  w*.88,
                  h*.79,
                  s*.31,
                  lw
              )

              sparkle(
                  d,
                  w*.10,
                  h*.91,
                  s*.16,
                  BLACK,
                  lw
              )

              save(im,path)

          p=os.path.join(
              IMG,
              "mainBgImage@3x.png"
          )

          if os.path.exists(p):
              main_background(p)

          p=os.path.join(
              IMG,
              "chatroomBgImage@3x.png"
          )

          if os.path.exists(p):
              chat_background(p)

          # =========================================================
          # CAT-EAR BUBBLE V6
          #
          # NO PHOTO.
          #
          # Main objective:
          # cleaner silhouette / 2 obvious ears / pill body
          # =========================================================

          def make_bubble(path):

              src=rgba(path)

              w,h=src.size

              name=os.path.basename(path)

              send="Send" in name
              selected="Selected" in name
              first="01" in name

              den=density(path)

              im=Image.new(
                  "RGBA",
                  (w,h),
                  (0,0,0,0)
              )

              d=ImageDraw.Draw(im)

              if send:

                  if selected:
                      fill=(45,45,45,255)
                  else:
                      fill=BLACK

                  edge=fill

              else:

                  if selected:
                      fill=(245,245,245,255)
                  else:
                      fill=WHITE

                  edge=BLACK

              # slightly thinner than V5
              stroke=max(
                  2,
                  int(1.35*den)
              )

              # less empty top region
              if first:
                  top=int(h*.19)
              else:
                  top=int(h*.08)

              left=max(
                  den,
                  int(w*.018)
              )

              right=w-left

              bottom=h-max(
                  den,
                  int(h*.018)
              )

              # strong pill shape
              radius=max(
                  14,
                  int(min(w,h)*.35)
              )

              # body first
              d.rounded_rectangle(
                  (
                      left,
                      top,
                      right,
                      bottom
                  ),
                  radius=radius,
                  fill=fill,
                  outline=edge,
                  width=stroke
              )

              # -------------------------------------------------
              # CAT EARS
              #
              # V6: closer together and lower
              # -------------------------------------------------

              ear_h=int(
                  h*.105
                  if first
                  else h*.075
              )

              ear_w=int(w*.155)

              center=w*.50

              gap=w*.15

              left_center=(
                  center-gap
              )

              right_center=(
                  center+gap
              )

              left_ear=[
                  (
                      left_center-ear_w*.50,
                      top+stroke
                  ),
                  (
                      left_center,
                      top-ear_h
                  ),
                  (
                      left_center+ear_w*.50,
                      top+stroke
                  )
              ]

              right_ear=[
                  (
                      right_center-ear_w*.50,
                      top+stroke
                  ),
                  (
                      right_center,
                      top-ear_h
                  ),
                  (
                      right_center+ear_w*.50,
                      top+stroke
                  )
              ]

              # fill
              d.polygon(
                  left_ear,
                  fill=fill
              )

              d.polygon(
                  right_ear,
                  fill=fill
              )

              # outline
              d.line(
                  left_ear,
                  fill=edge,
                  width=stroke,
                  joint="curve"
              )

              d.line(
                  right_ear,
                  fill=edge,
                  width=stroke,
                  joint="curve"
              )

              # remove ear base seams
              d.line(
                  (
                      left_ear[0][0]+stroke,
                      top+stroke,
                      left_ear[2][0]-stroke,
                      top+stroke
                  ),
                  fill=fill,
                  width=stroke+3
              )

              d.line(
                  (
                      right_ear[0][0]+stroke,
                      top+stroke,
                      right_ear[2][0]-stroke,
                      top+stroke
                  ),
                  fill=fill,
                  width=stroke+3
              )

              save(im,path)

          for p in glob.glob(
              os.path.join(
                  IMG,
                  "chatroomBubble*.png"
              )
          ):

              make_bubble(p)

          # =========================================================
          # TAB ICONS
          #
          # Friends = Penguin
          # Chats = Tiger
          # Open/Now = Black cat
          # Shopping = Blue butterfly
          # More = heart
          # =========================================================

          def tab_icon(path):

              src=rgba(path)

              w,h=src.size

              name=os.path.basename(path)

              im=Image.new(
                  "RGBA",
                  (w,h),
                  (0,0,0,0)
              )

              d=ImageDraw.Draw(im)

              s=min(w,h)*.72

              if "Friends" in name:

                  penguin(
                      d,
                      w/2,
                      h/2,
                      s
                  )

              elif "Chats" in name:

                  tiger(
                      d,
                      w/2,
                      h/2,
                      s
                  )

              elif "Now" in name or "Call" in name:

                  black_cat(
                      d,
                      w/2,
                      h/2,
                      s
                  )

              elif "Shopping" in name or "Piccoma" in name:

                  butterfly(
                      d,
                      w/2,
                      h/2,
                      s*.80,
                      max(
                          2,
                          int(s*.035)
                      )
                  )

              else:

                  # More / fallback:
                  # simple heart is safe in the icon bounds
                  heart(
                      d,
                      w/2,
                      h/2,
                      s*.56,
                      BLACK,
                      max(
                          2,
                          int(s*.05)
                      )
                  )

              save(im,path)

          for p in glob.glob(
              os.path.join(
                  IMG,
                  "maintabIco*.png"
              )
          ):

              tab_icon(p)

          # =========================================================
          # TAB BACKGROUND
          # =========================================================

          for p in glob.glob(
              os.path.join(
                  IMG,
                  "maintabBgImage@*.png"
              )
          ):

              src=rgba(p)

              w,h=src.size

              im=Image.new(
                  "RGBA",
                  (w,h),
                  WHITE
              )

              d=ImageDraw.Draw(im)

              d.line(
                  (
                      0,
                      1,
                      w,
                      1
                  ),
                  fill=(20,20,20,55),
                  width=max(
                      1,
                      h//45
                  )
              )

              save(im,p)

          # =========================================================
          # PROFILE PLACEHOLDER
          # =========================================================

          profile=os.path.join(
              IMG,
              "profileImg01@3x.png"
          )

          if os.path.exists(profile):

              src=rgba(profile)

              w,h=src.size

              im=Image.new(
                  "RGBA",
                  (w,h),
                  WHITE
              )

              d=ImageDraw.Draw(im)

              black_cat(
                  d,
                  w/2,
                  h/2,
                  min(w,h)*.72
              )

              save(im,profile)

          print("JIWOONG BW V6 artwork complete.")
          PY

      - name: Update CSS V6
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          path=Path(
              "theme/KakaoTalkTheme.css"
          )

          css=path.read_text(
              encoding="utf-8",
              errors="ignore"
          )

          # ======================================================
          # Manifest
          # ======================================================

          css=re.sub(
              r"-kakaotalk-theme-name:[^;]*;",
              "-kakaotalk-theme-name: 'JIWOONG BW V6';",
              css
          )

          css=re.sub(
              r"-kakaotalk-theme-id:[^;]*;",
              "-kakaotalk-theme-id: 'com.uo.jiwoong.bw.v6';",
              css
          )

          css=re.sub(
              r"-kakaotalk-author-name:[^;]*;",
              "-kakaotalk-author-name: 'UO';",
              css
          )

          # ======================================================
          # Palette
          # ======================================================

          css=css.replace(
              "#FFDEDE",
              "#FCFBF8"
          )

          css=css.replace(
              "#FFFCEE",
              "#FCFBF8"
          )

          css=css.replace(
              "#FFF8DA",
              "#FCFBF8"
          )

          # ======================================================
          # SEND
          # ======================================================

          m=re.search(
              r"MessageCellStyle-Send\s*\{.*?\}",
              css,
              re.S
          )

          if m:

              block=m.group(0)

              block=re.sub(
                  r"-ios-title-edgeinsets:[^;]*;",
                  "-ios-title-edgeinsets: 19px 30px 10px 30px;",
                  block
              )

              block=re.sub(
                  r"-ios-group-title-edgeinsets:[^;]*;",
                  "-ios-group-title-edgeinsets: 9px 30px 10px 30px;",
                  block
              )

              block=re.sub(
                  r"-ios-text-color:[^;]*;",
                  "-ios-text-color: #FFFFFF;",
                  block
              )

              block=re.sub(
                  r"-ios-selected-text-color:[^;]*;",
                  "-ios-selected-text-color: #FFFFFF;",
                  block
              )

              block=re.sub(
                  r"-ios-unread-text-color:[^;]*;",
                  "-ios-unread-text-color: #D8D8D8;",
                  block
              )

              css=(
                  css[:m.start()]
                  +block+
                  css[m.end():]
              )

          # ======================================================
          # RECEIVE
          # ======================================================

          m=re.search(
              r"MessageCellStyle-Receive\s*\{.*?\}",
              css,
              re.S
          )

          if m:

              block=m.group(0)

              block=re.sub(
                  r"-ios-title-edgeinsets:[^;]*;",
                  "-ios-title-edgeinsets: 19px 30px 10px 30px;",
                  block
              )

              block=re.sub(
                  r"-ios-group-title-edgeinsets:[^;]*;",
                  "-ios-group-title-edgeinsets: 9px 30px 10px 30px;",
                  block
              )

              block=re.sub(
                  r"-ios-text-color:[^;]*;",
                  "-ios-text-color: #171717;",
                  block
              )

              block=re.sub(
                  r"-ios-selected-text-color:[^;]*;",
                  "-ios-selected-text-color: #171717;",
                  block
              )

              block=re.sub(
                  r"-ios-unread-text-color:[^;]*;",
                  "-ios-unread-text-color: #777777;",
                  block
              )

              css=(
                  css[:m.start()]
                  +block+
                  css[m.end():]
              )

          path.write_text(
              css,
              encoding="utf-8"
          )

          print("V6 CSS complete.")
          PY

      - name: Package V6
        shell: bash
        run: |
          set -e

          rm -f JIWOONG_BW.ktheme

          cd theme

          zip -q -r ../JIWOONG_BW.ktheme .

          cd ..

          unzip -t JIWOONG_BW.ktheme

          ls -lh JIWOONG_BW.ktheme

      - name: Commit V6
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add JIWOONG_BW.ktheme

          if git diff --cached --quiet; then
