name: Build JIWOONG BW V3

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip
          python3 -m pip install pillow rembg onnxruntime

      - name: Extract base theme
        run: |
          rm -rf theme
          mkdir theme
          unzip -q mangdaeng.ktheme -d theme

      - name: Generate JIWOONG V3
        run: |
          python3 <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          from rembg import remove
          import os, glob, math

          DIR = "theme/Images"

          BLACK = (18,18,18,255)
          WHITE = (255,255,255,255)
          CREAM = (252,251,248,255)
          GRAY = (95,95,95,255)
          BLUE = (112,183,230,255)

          # =====================================================
          # BASIC
          # =====================================================

          def open_rgba(p):
              return Image.open(p).convert("RGBA")

          def save(im,p):
              im.save(p,"PNG",optimize=True)

          def scale(path):
              if "@3x" in path:
                  return 3
              if "@2x" in path:
                  return 2
              return 3

          # =====================================================
          # HAND DRAWN DECORATIONS
          # =====================================================

          def heart(d,x,y,s,c=BLACK,w=3):
              pts=[]

              for i in range(101):
                  t=math.pi*2*i/100
                  xx=16*math.sin(t)**3
                  yy=(
                      13*math.cos(t)
                      -5*math.cos(2*t)
                      -2*math.cos(3*t)
                      -math.cos(4*t)
                  )

                  pts.append(
                      (
                          x+xx*s/32,
                          y-yy*s/32
                      )
                  )

              d.line(
                  pts,
                  fill=c,
                  width=w,
                  joint="curve"
              )

          def sparkle(d,x,y,s,c=BLACK,w=3):

              d.line(
                  (x,y-s,x,y+s),
                  fill=c,
                  width=w
              )

              d.line(
                  (
                      x-s*.38,
                      y,
                      x+s*.38,
                      y
                  ),
                  fill=c,
                  width=w
              )

          def clover(d,x,y,s,c=BLACK,w=3):

              r=s*.19

              for dx,dy in [
                  (-r,-r),
                  (r,-r),
                  (-r,r),
                  (r,r)
              ]:

                  d.ellipse(
                      (
                          x+dx-r,
                          y+dy-r,
                          x+dx+r,
                          y+dy+r
                      ),
                      outline=c,
                      width=w
                  )

              d.line(
                  (
                      x,
                      y+r*1.7,
                      x+s*.12,
                      y+s*.48
                  ),
                  fill=c,
                  width=w
              )

          def bow(d,x,y,s,c=BLACK,w=3):

              d.ellipse(
                  (
                      x-s*.46,
                      y-s*.25,
                      x-s*.03,
                      y+s*.20
                  ),
                  outline=c,
                  width=w
              )

              d.ellipse(
                  (
                      x+s*.03,
                      y-s*.25,
                      x+s*.46,
                      y+s*.20
                  ),
                  outline=c,
                  width=w
              )

              d.ellipse(
                  (
                      x-s*.08,
                      y-s*.08,
                      x+s*.08,
                      y+s*.08
                  ),
                  fill=c
              )

          def paw(d,x,y,s,c=BLACK):

              d.ellipse(
                  (
                      x-s*.22,
                      y,
                      x+s*.22,
                      y+s*.28
                  ),
                  fill=c
              )

              for dx,dy in [
                  (-.28,-.18),
                  (-.09,-.30),
                  (.12,-.30),
                  (.30,-.15)
              ]:

                  d.ellipse(
                      (
                          x+s*dx-s*.08,
                          y+s*dy-s*.08,
                          x+s*dx+s*.08,
                          y+s*dy+s*.08
                      ),
                      fill=c
                  )

          # =====================================================
          # BUTTERFLY
          # =====================================================

          def butterfly(d,x,y,s,w=3):

              edge=BLACK

              # left top
              d.ellipse(
                  (
                      x-s*.48,
                      y-s*.38,
                      x-s*.03,
                      y+s*.02
                  ),
                  fill=(150,210,242,255),
                  outline=edge,
                  width=w
              )

              # right top
              d.ellipse(
                  (
                      x+s*.03,
                      y-s*.38,
                      x+s*.48,
                      y+s*.02
                  ),
                  fill=(150,210,242,255),
                  outline=edge,
                  width=w
              )

              # lower wings
              d.ellipse(
                  (
                      x-s*.38,
                      y,
                      x-s*.02,
                      y+s*.34
                  ),
                  fill=(105,175,225,255),
                  outline=edge,
                  width=w
              )

              d.ellipse(
                  (
                      x+s*.02,
                      y,
                      x+s*.38,
                      y+s*.34
                  ),
                  fill=(105,175,225,255),
                  outline=edge,
                  width=w
              )

              d.line(
                  (
                      x,
                      y-s*.18,
                      x,
                      y+s*.25
                  ),
                  fill=edge,
                  width=w
              )

          # =====================================================
          # BLACK CAT
          # =====================================================

          def blackcat(d,x,y,s):

              r=s*.32

              # ears
              d.polygon(
                  [
                      (x-r*.82,y-r*.55),
                      (x-r*.92,y-r*1.25),
                      (x-r*.18,y-r*.82)
                  ],
                  fill=BLACK
              )

              d.polygon(
                  [
                      (x+r*.82,y-r*.55),
                      (x+r*.92,y-r*1.25),
                      (x+r*.18,y-r*.82)
                  ],
                  fill=BLACK
              )

              d.ellipse(
                  (
                      x-r,
                      y-r,
                      x+r,
                      y+r
                  ),
                  fill=BLACK
              )

              eye=max(2,int(s*.055))

              for ex in (
                  x-r*.36,
                  x+r*.36
              ):

                  d.ellipse(
                      (
                          ex-eye,
                          y-r*.05-eye,
                          ex+eye,
                          y-r*.05+eye
                      ),
                      fill=(230,190,40,255)
                  )

                  d.ellipse(
                      (
                          ex-eye*.20,
                          y-r*.05-eye*.75,
                          ex+eye*.20,
                          y-r*.05+eye*.75
                      ),
                      fill=BLACK
                  )

          # =====================================================
          # PENGUIN
          # =====================================================

          def penguin(d,x,y,s):

              rw=s*.31
              rh=s*.39

              d.ellipse(
                  (
                      x-rw,
                      y-rh,
                      x+rw,
                      y+rh
                  ),
                  fill=BLACK
              )

              d.ellipse(
                  (
                      x-rw*.66,
                      y-rh*.42,
                      x+rw*.66,
                      y+rh*.74
                  ),
                  fill=WHITE
              )

              # eyes
              er=max(2,int(s*.035))

              d.ellipse(
                  (
                      x-rw*.30-er,
                      y-rh*.30-er,
                      x-rw*.30+er,
                      y-rh*.30+er
                  ),
                  fill=BLACK
              )

              d.ellipse(
                  (
                      x+rw*.30-er,
                      y-rh*.30-er,
                      x+rw*.30+er,
                      y-rh*.30+er
                  ),
                  fill=BLACK
              )

              # beak
              d.polygon(
                  [
                      (x-s*.10,y-rh*.08),
                      (x+s*.10,y-rh*.08),
                      (x,y+s*.07)
                  ],
                  fill=(244,174,38,255),
                  outline=BLACK
              )

          # =====================================================
          # TIGER
          # =====================================================

          def tiger(d,x,y,s):

              r=s*.32

              orange=(241,151,39,255)

              d.ellipse(
                  (
                      x-r,
                      y-r,
                      x+r,
                      y+r
                  ),
                  fill=orange,
                  outline=BLACK,
                  width=max(2,int(s*.035))
              )

              # ears
              d.ellipse(
                  (
                      x-r*1.02,
                      y-r*1.05,
                      x-r*.35,
                      y-r*.35
                  ),
                  fill=orange,
                  outline=BLACK,
                  width=max(2,int(s*.03))
              )

              d.ellipse(
                  (
                      x+r*.35,
                      y-r*1.05,
                      x+r*1.02,
                      y-r*.35
                  ),
                  fill=orange,
                  outline=BLACK,
                  width=max(2,int(s*.03))
              )

              # muzzle
              d.ellipse(
                  (
                      x-r*.50,
                      y+r*.05,
                      x+r*.50,
                      y+r*.65
                  ),
                  fill=WHITE
              )

              # stripes
              lw=max(2,int(s*.045))

              for xx in (-.40,0,.40):

                  d.line(
                      (
                          x+r*xx,
                          y-r*.86,
                          x+r*xx*.65,
                          y-r*.32
                      ),
                      fill=BLACK,
                      width=lw
                  )

              # eyes
              eye=max(2,int(s*.035))

              for ex in (
                  x-r*.36,
                  x+r*.36
              ):

                  d.ellipse(
                      (
                          ex-eye,
                          y-r*.08-eye,
                          ex+eye,
                          y-r*.08+eye
                      ),
                      fill=BLACK
                  )

          # =====================================================
          # JIWOONG HEAD
          # =====================================================

          photo=None

          for p in [
              "IMG_5895.png",
              "IMG_5895.jpeg",
              "IMG_5895.jpg"
          ]:
              if os.path.exists(p):
                  photo=p
                  break

          HEAD=None

          if photo:

              print("Creating Jiwoong sticker...")

              src=open_rgba(photo)

              W,H=src.size

              # central person
              crop=src.crop(
                  (
                      int(W*.25),
                      int(H*.02),
                      int(W*.67),
                      int(H*.64)
                  )
              )

              try:

                  head=remove(crop)

                  if not isinstance(head,Image.Image):
                      from io import BytesIO
                      head=Image.open(
                          BytesIO(head)
                      )

                  head=head.convert("RGBA")

                  alpha=head.getchannel("A")

                  alpha=alpha.point(
                      lambda a:
                      0 if a<35 else a
                  )

                  head.putalpha(alpha)

                  bbox=alpha.getbbox()

                  if bbox:
                      head=head.crop(bbox)

                  # cut body
                  hw,hh=head.size

                  head=head.crop(
                      (
                          0,
                          0,
                          hw,
                          int(hh*.68)
                      )
                  )

                  bbox=head.getchannel("A").getbbox()

                  if bbox:
                      head=head.crop(bbox)

                  HEAD=head

                  save(
                      HEAD,
                      "jiwoong_head_v3.png"
                  )

              except Exception as e:
                  print(e)

          # =====================================================
          # WHITE OUTLINE STICKER
          # =====================================================

          def sticker(base,asset,x,y,border):

              alpha=asset.getchannel("A")

              k=max(3,border*2+1)

              if k%2==0:
                  k+=1

              spread=alpha.filter(
                  ImageFilter.MaxFilter(k)
              )

              outline=Image.new(
                  "RGBA",
                  asset.size,
                  WHITE
              )

              outline.putalpha(spread)

              base.alpha_composite(
                  outline,
                  (x,y)
              )

              base.alpha_composite(
                  asset,
                  (x,y)
              )

          # =====================================================
          # BACKGROUNDS
          # =====================================================

          def make_bg(path,chat=False):

              old=open_rgba(path)

              w,h=old.size

              im=Image.new(
                  "RGBA",
                  (w,h),
                  CREAM
              )

              d=ImageDraw.Draw(im)

              lw=max(2,w//380)

              S=w/12

              if chat:

                  heart(
                      d,w*.08,h*.12,S*.48,
                      BLACK,lw
                  )

                  sparkle(
                      d,w*.84,h*.11,S*.32,
                      BLACK,lw
                  )

                  clover(
                      d,w*.12,h*.27,S*.48,
                      BLACK,lw
                  )

                  heart(
                      d,w*.89,h*.35,S*.38,
                      BLACK,lw
                  )

                  sparkle(
                      d,w*.12,h*.51,S*.28,
                      BLACK,lw
                  )

                  clover(
                      d,w*.87,h*.61,S*.50,
                      BLACK,lw
                  )

                  heart(
                      d,w*.10,h*.79,S*.42,
                      BLACK,lw
                  )

                  butterfly(
                      d,w*.85,h*.83,S*.60,lw
                  )

                  bow(
                      d,w*.16,h*.92,S*.55,
                      BLACK,lw
                  )

              else:

                  # closer to promotional mockup
                  penguin(
                      d,w*.12,h*.18,S*1.30
                  )

                  tiger(
                      d,w*.13,h*.32,S*1.18
                  )

                  blackcat(
                      d,w*.12,h*.45,S*1.05
                  )

                  butterfly(
                      d,w*.80,h*.23,S*.95,lw
                  )

                  butterfly(
                      d,w*.79,h*.54,S*.92,lw
                  )

                  heart(
                      d,w*.63,h*.15,S*.65,
                      BLACK,lw
                  )

                  clover(
                      d,w*.18,h*.63,S*.60,
                      BLACK,lw
                  )

                  bow(
                      d,w*.28,h*.78,S*.65,
                      BLACK,lw
                  )

                  sparkle(
                      d,w*.85,h*.75,S*.35,
                      BLACK,lw
                  )

                  paw(
                      d,w*.18,h*.90,S*.42,
                      BLACK
                  )

                  if HEAD:

                      hh=HEAD.copy()

                      hh.thumbnail(
                          (
                              int(w*.64),
                              int(h*.34)
                          ),
                          Image.Resampling.LANCZOS
                      )

                      sticker(
                          im,
                          hh,
                          int(w*.18),
                          int(h*.64),
                          max(4,w//160)
                      )

              save(im,path)

          p=os.path.join(
              DIR,
              "chatroomBgImage@3x.png"
          )

          if os.path.exists(p):
              make_bg(p,True)

          p=os.path.join(
              DIR,
              "mainBgImage@3x.png"
          )

          if os.path.exists(p):
              make_bg(p,False)

          # =====================================================
          # CAT EAR CHAT BUBBLES
          # =====================================================

          def bubble(path):

              original=open_rgba(path)

              w,h=original.size

              name=os.path.basename(path)

              send="Send" in name
              first="01" in name
              selected="Selected" in name

              den=scale(path)

              im=Image.new(
                  "RGBA",
                  (w,h),
                  (0,0,0,0)
              )

              d=ImageDraw.Draw(im)

              if send:
                  fill=(
                      (45,45,45,255)
                      if selected
                      else BLACK
                  )
                  edge=fill

              else:
                  fill=(
                      (244,244,244,255)
                      if selected
                      else WHITE
                  )
                  edge=BLACK

              stroke=max(
                  2,
                  int(1.5*den)
              )

              # Larger decorative fixed region for 01
              top=int(
                  h*.40
                  if first
                  else h*.20
              )

              left=max(2,den)
              right=w-max(2,den)
              bottom=h-max(2,den)

              radius=int(
                  min(w,h)*.17
              )

              # CAT EARS FIRST
              earH=int(
                  h*.24
                  if first
                  else h*.17
              )

              earW=int(w*.19)

              lx=left+radius*.55
              rx=right-radius*.55

              leftEar=[
                  (lx,top+3),
                  (lx+earW*.46,top-earH),
                  (lx+earW,top+3)
              ]

              rightEar=[
                  (rx-earW,top+3),
                  (rx-earW*.46,top-earH),
                  (rx,top+3)
              ]

              d.polygon(
                  leftEar,
                  fill=fill
              )

              d.polygon(
                  rightEar,
                  fill=fill
              )

              # BODY
              d.rounded_rectangle(
                  (
                      left,
                      top,
                      right,
                      bottom
                  ),
                  radius=radius,
                  fill=fill,
                  outline=edge,
                  width=stroke
              )

              # EAR OUTLINE
              d.line(
                  leftEar,
                  fill=edge,
                  width=stroke,
                  joint="curve"
              )

              d.line(
                  rightEar,
                  fill=edge,
                  width=stroke,
                  joint="curve"
              )

              # Hide ear base line visually
              d.line(
                  (
                      lx+stroke,
                      top+stroke,
                      lx+earW-stroke,
                      top+stroke
                  ),
                  fill=fill,
                  width=stroke+2
              )

              d.line(
                  (
                      rx-earW+stroke,
                      top+stroke,
                      rx-stroke,
                      top+stroke
                  ),
                  fill=fill,
                  width=stroke+2
              )

              # Jiwoong sticker on first bubble
              if first and HEAD:

                  head=HEAD.copy()

                  # MUCH BIGGER than previous version
                  head.thumbnail(
                      (
                          int(w*.48),
                          int(h*.44)
                      ),
                      Image.Resampling.LANCZOS
                  )

                  if send:
                      x=w-head.width
                  else:
                      x=0

                  y=max(
                      0,
                      top-head.height+den
                  )

                  sticker(
                      im,
                      head,
                      int(x),
                      int(y),
                      max(2,den)
                  )

              save(im,path)

          for p in glob.glob(
              DIR+"/chatroomBubble*.png"
          ):
              bubble(p)

          # =====================================================
          # TAB ICONS
          # Friends = Penguin
          # Chats = Tiger
          # Open chat = Black cat
          # Shopping = Butterfly
          # More = Jiwoong
          # =====================================================

          def tab(path):

              old=open_rgba(path)

              w,h=old.size

              name=os.path.basename(path)

              im=Image.new(
                  "RGBA",
                  (w,h),
                  (0,0,0,0)
              )

              d=ImageDraw.Draw(im)

              s=min(w,h)*.92

              if "Friends" in name:

                  penguin(
                      d,w/2,h/2,s
                  )

              elif "Chats" in name:

                  tiger(
                      d,w/2,h/2,s
                  )

              elif "Now" in name or "Call" in name:

                  blackcat(
                      d,w/2,h/2,s
                  )

              elif "Shopping" in name or "Piccoma" in name:

                  butterfly(
                      d,w/2,h/2,s,
                      max(2,int(s*.035))
                  )

              elif "More" in name and HEAD:

                  hh=HEAD.copy()

                  hh.thumbnail(
                      (
                          int(w*.92),
                          int(h*.92)
                      ),
                      Image.Resampling.LANCZOS
                  )

                  im.alpha_composite(
                      hh,
                      (
                          (w-hh.width)//2,
                          (h-hh.height)//2
                      )
                  )

              else:

                  heart(
                      d,
                      w/2,
                      h/2,
                      s*.60,
                      BLACK,
                      max(2,int(s*.045))
                  )

              save(im,path)

          for p in glob.glob(
              DIR+"/maintabIco*.png"
          ):
              tab(p)

          # =====================================================
          # TAB BAR BACKGROUND
          # =====================================================

          for p in glob.glob(
              DIR+"/maintabBgImage@*.png"
          ):

              old=open_rgba(p)

              w,h=old.size

              im=Image.new(
                  "RGBA",
                  (w,h),
                  WHITE
              )

              d=ImageDraw.Draw(im)

              d.line(
                  (0,1,w,1),
                  fill=(25,25,25,70),
                  width=max(1,h//40)
              )

              save(im,p)

          # =====================================================
          # PROFILE PLACEHOLDER
          # =====================================================

          profile=os.path.join(
              DIR,
              "profileImg01@3x.png"
          )

          if os.path.exists(profile):

              old=open_rgba(profile)

              w,h=old.size

              im=Image.new(
                  "RGBA",
                  (w,h),
                  (0,0,0,0)
              )

              d=ImageDraw.Draw(im)

              blackcat(
                  d,
                  w/2,
                  h/2,
                  min(w,h)*.90
              )

              save(im,profile)

          print("JIWOONG BW V3 assets generated.")
          PY

      - name: Update theme CSS
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p=Path(
              "theme/KakaoTalkTheme.css"
          )

          css=p.read_text(
              encoding="utf-8",
              errors="ignore"
          )

          css=re.sub(
              r"-kakaotalk-theme-name:[^;]+;",
              "-kakaotalk-theme-name: 'JIWOONG BW';",
              css
          )

          css=re.sub(
              r"-kakaotalk-theme-id:[^;]+;",
              "-kakaotalk-theme-id: 'com.uo.jiwoong.bw.v3';",
              css
          )

          css=re.sub(
              r"-kakaotalk-author-name:[^;]+;",
              "-kakaotalk-author-name: 'UO';",
              css
          )

          # Main palette
          css=css.replace(
              "#FFDEDE",
              "#FCFBF8"
          )

          css=css.replace(
              "#FFFCEE",
              "#FCFBF8"
          )

          css=css.replace(
              "#FFF8DA",
              "#FCFBF8"
          )

          # Send = white text
          block=re.search(
              r"MessageCellStyle-Send\s*\{.*?\}",
              css,
              re.S
          )

          if block:

              b=block.group(0)

              b=re.sub(
                  r"-ios-text-color:\s*#[0-9A-Fa-f]{6};",
                  "-ios-text-color: #FFFFFF;",
                  b
              )

              b=re.sub(
                  r"-ios-selected-text-color:\s*#[0-9A-Fa-f]{6};",
                  "-ios-selected-text-color: #FFFFFF;",
                  b
              )

              css=(
                  css[:block.start()]
                  +b+
                  css[block.end():]
              )

          # Receive = black text
          block=re.search(
              r"MessageCellStyle-Receive\s*\{.*?\}",
              css,
              re.S
          )

          if block:

              b=block.group(0)

              b=re.sub(
                  r"-ios-text-color:\s*#[0-9A-Fa-f]{6};",
                  "-ios-text-color: #171717;",
                  b
              )

              b=re.sub(
                  r"-ios-selected-text-color:\s*#[0-9A-Fa-f]{6};",
                  "-ios-selected-text-color: #171717;",
                  b
              )

              css=(
                  css[:block.start()]
                  +b+
                  css[block.end():]
              )

          p.write_text(
              css,
              encoding="utf-8"
          )
          PY

      - name: Package
        run: |
          rm -f JIWOONG_BW.ktheme

          cd theme

          zip -q -r ../JIWOONG_BW.ktheme .

          cd ..

          unzip -t JIWOONG_BW.ktheme

          ls -lh JIWOONG_BW.ktheme

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
