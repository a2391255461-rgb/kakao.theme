name: Build JIWOONG BW V5

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y unzip zip
          python3 -m pip install --upgrade pip
          python3 -m pip install pillow rembg onnxruntime

      - name: Extract base theme
        shell: bash
        run: |
          set -e
          rm -rf theme
          mkdir theme
          unzip -q mangdaeng.ktheme -d theme
          test -f theme/KakaoTalkTheme.css
          test -d theme/Images

      - name: Generate V5 assets
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from PIL import Image, ImageDraw, ImageFilter
          from rembg import remove
          from io import BytesIO
          import os, glob, math

          IMG = "theme/Images"

          BLACK = (18,18,18,255)
          WHITE = (255,255,255,255)
          CREAM = (252,251,248,255)
          SOFT_BLACK = (35,35,35,255)
          BLUE1 = (160,211,240,255)
          BLUE2 = (105,176,225,255)

          # =====================================================
          # helpers
          # =====================================================

          def open_rgba(path):
              return Image.open(path).convert("RGBA")

          def save(im, path):
              im.save(path, "PNG", optimize=True)

          def density(path):
              if "@3x" in path:
                  return 3
              if "@2x" in path:
                  return 2
              return 3

          # =====================================================
          # doodles
          # =====================================================

          def heart(d,cx,cy,s,c=BLACK,w=3):
              pts=[]
              for i in range(101):
                  t=math.pi*2*i/100
                  x=16*math.sin(t)**3
                  y=13*math.cos(t)-5*math.cos(2*t)-2*math.cos(3*t)-math.cos(4*t)
                  pts.append((cx+x*s/32, cy-y*s/32))
              d.line(pts, fill=c, width=w, joint="curve")

          def sparkle(d,cx,cy,s,c=BLACK,w=3):
              d.line((cx,cy-s,cx,cy+s), fill=c, width=w)
              d.line((cx-s*.42,cy,cx+s*.42,cy), fill=c, width=w)

          def clover(d,cx,cy,s,c=BLACK,w=3):
              r=s*.18
              for dx,dy in [(-r,-r),(r,-r),(-r,r),(r,r)]:
                  d.ellipse(
                      (cx+dx-r,cy+dy-r,cx+dx+r,cy+dy+r),
                      outline=c,
                      width=w
                  )
              d.line(
                  (cx,cy+r*1.6,cx+s*.11,cy+s*.48),
                  fill=c,
                  width=w
              )

          def bow(d,cx,cy,s,c=BLACK,w=3):
              d.ellipse(
                  (cx-s*.43,cy-s*.23,cx-s*.04,cy+s*.20),
                  outline=c,
                  width=w
              )
              d.ellipse(
                  (cx+s*.04,cy-s*.23,cx+s*.43,cy+s*.20),
                  outline=c,
                  width=w
              )
              d.ellipse(
                  (cx-s*.07,cy-s*.07,cx+s*.07,cy+s*.07),
                  fill=c
              )

          def butterfly(d,cx,cy,s,w=3):
              d.ellipse(
                  (cx-s*.48,cy-s*.39,cx-s*.03,cy+s*.03),
                  fill=BLUE1,
                  outline=BLACK,
                  width=w
              )
              d.ellipse(
                  (cx+s*.03,cy-s*.39,cx+s*.48,cy+s*.03),
                  fill=BLUE1,
                  outline=BLACK,
                  width=w
              )
              d.ellipse(
                  (cx-s*.38,cy,cx-s*.02,cy+s*.34),
                  fill=BLUE2,
                  outline=BLACK,
                  width=w
              )
              d.ellipse(
                  (cx+s*.02,cy,cx+s*.38,cy+s*.34),
                  fill=BLUE2,
                  outline=BLACK,
                  width=w
              )
              d.line(
                  (cx,cy-s*.18,cx,cy+s*.27),
                  fill=BLACK,
                  width=w
              )

          # =====================================================
          # animal icons
          # =====================================================

          def black_cat(d,cx,cy,s):
              r=s*.32
              d.polygon(
                  [(cx-r*.82,cy-r*.55),(cx-r*.92,cy-r*1.22),(cx-r*.18,cy-r*.82)],
                  fill=BLACK
              )
              d.polygon(
                  [(cx+r*.82,cy-r*.55),(cx+r*.92,cy-r*1.22),(cx+r*.18,cy-r*.82)],
                  fill=BLACK
              )
              d.ellipse(
                  (cx-r,cy-r,cx+r,cy+r),
                  fill=BLACK
              )

              eye=max(2,int(s*.05))
              for ex in [cx-r*.36,cx+r*.36]:
                  d.ellipse(
                      (ex-eye,cy-r*.04-eye,ex+eye,cy-r*.04+eye),
                      fill=(236,197,43,255)
                  )
                  d.rectangle(
                      (ex-eye*.1,cy-r*.04-eye*.7,ex+eye*.1,cy-r*.04+eye*.7),
                      fill=BLACK
                  )

          def penguin(d,cx,cy,s):
              rw=s*.30
              rh=s*.39
              d.ellipse(
                  (cx-rw,cy-rh,cx+rw,cy+rh),
                  fill=BLACK
              )
              d.ellipse(
                  (cx-rw*.64,cy-rh*.43,cx+rw*.64,cy+rh*.72),
                  fill=WHITE
              )
              eye=max(2,int(s*.034))
              for ex in [cx-rw*.30,cx+rw*.30]:
                  d.ellipse(
                      (ex-eye,cy-rh*.30-eye,ex+eye,cy-rh*.30+eye),
                      fill=BLACK
                  )
              d.polygon(
                  [(cx-s*.10,cy-rh*.08),(cx+s*.10,cy-rh*.08),(cx,cy+s*.07)],
                  fill=(244,175,38,255)
              )

          def tiger(d,cx,cy,s):
              r=s*.32
              orange=(241,151,39,255)
              lw=max(2,int(s*.035))

              d.ellipse(
                  (cx-r,cy-r,cx+r,cy+r),
                  fill=orange,
                  outline=BLACK,
                  width=lw
              )
              d.ellipse(
                  (cx-r*1.02,cy-r*1.04,cx-r*.35,cy-r*.35),
                  fill=orange,
                  outline=BLACK,
                  width=lw
              )
              d.ellipse(
                  (cx+r*.35,cy-r*1.04,cx+r*1.02,cy-r*.35),
                  fill=orange,
                  outline=BLACK,
                  width=lw
              )

              d.ellipse(
                  (cx-r*.50,cy+r*.03,cx+r*.50,cy+r*.66),
                  fill=WHITE
              )

              stripe=max(2,int(s*.045))
              for xx in [-.42,0,.42]:
                  d.line(
                      (cx+r*xx,cy-r*.86,cx+r*xx*.65,cy-r*.33),
                      fill=BLACK,
                      width=stripe
                  )

              eye=max(2,int(s*.034))
              for ex in [cx-r*.36,cx+r*.36]:
                  d.ellipse(
                      (ex-eye,cy-r*.08-eye,ex+eye,cy-r*.08+eye),
                      fill=BLACK
                  )

          # =====================================================
          # prepare Jiwoong
          # =====================================================

          HEAD=None
          photo=None

          for p in ["IMG_5895.png","IMG_5895.jpeg","IMG_5895.jpg"]:
              if os.path.exists(p):
                  photo=p
                  break

          if photo:
              print("Preparing Jiwoong V5 sticker...")

              src=open_rgba(photo)
              W,H=src.size

              crop=src.crop(
                  (
                      int(W*.25),
                      int(H*.01),
                      int(W*.67),
                      int(H*.56)
                  )
              )

              try:
                  result=remove(crop)

                  if isinstance(result,Image.Image):
                      head=result.convert("RGBA")
                  else:
                      head=Image.open(BytesIO(result)).convert("RGBA")

                  alpha=head.getchannel("A")
                  alpha=alpha.point(lambda a: 0 if a<45 else a)
                  head.putalpha(alpha)

                  bbox=alpha.getbbox()
                  if bbox:
                      head=head.crop(bbox)

                  hw,hh=head.size

                  # much tighter crop
                  head=head.crop(
                      (
                          int(hw*.08),
                          0,
                          int(hw*.92),
                          int(hh*.58)
                      )
                  )

                  bbox=head.getchannel("A").getbbox()
                  if bbox:
                      head=head.crop(bbox)

                  HEAD=head
                  save(HEAD,"jiwoong_head_v5.png")

              except Exception as e:
                  print("Jiwoong removal failed:",e)

          # =====================================================
          # sticker helper
          # =====================================================

          def paste_sticker(base,asset,x,y,border=3):
              alpha=asset.getchannel("A")

              k=max(3,border*2+1)
              if k%2==0:
                  k+=1

              expanded=alpha.filter(ImageFilter.MaxFilter(k))

              halo=Image.new(
                  "RGBA",
                  asset.size,
                  WHITE
              )
              halo.putalpha(expanded)

              base.alpha_composite(halo,(x,y))
              base.alpha_composite(asset,(x,y))

          # =====================================================
          # backgrounds
          # =====================================================

          def make_main_bg(path):
              old=open_rgba(path)
              w,h=old.size

              im=Image.new(
                  "RGBA",
                  (w,h),
                  CREAM
              )

              d=ImageDraw.Draw(im)
              lw=max(2,w//420)
              s=w/14

              # sparse + black, not gray watermark
              heart(d,w*.90,h*.11,s*.33,BLACK,lw)
              sparkle(d,w*.10,h*.18,s*.22,BLACK,lw)
              clover(d,w*.90,h*.40,s*.34,BLACK,lw)
              bow(d,w*.10,h*.65,s*.36,BLACK,lw)
              sparkle(d,w*.88,h*.78,s*.20,BLACK,lw)
              heart(d,w*.12,h*.91,s*.30,BLACK,lw)

              save(im,path)

          def make_chat_bg(path):
              old=open_rgba(path)
              w,h=old.size

              im=Image.new(
                  "RGBA",
                  (w,h),
                  CREAM
              )

              d=ImageDraw.Draw(im)
              lw=max(2,w//420)
              s=w/14

              heart(d,w*.08,h*.12,s*.32,BLACK,lw)
              sparkle(d,w*.89,h*.15,s*.20,BLACK,lw)
              clover(d,w*.10,h*.35,s*.34,BLACK,lw)
              heart(d,w*.89,h*.46,s*.27,BLACK,lw)
              bow(d,w*.12,h*.67,s*.33,BLACK,lw)
              butterfly(d,w*.87,h*.79,s*.34,lw)
              sparkle(d,w*.11,h*.91,s*.18,BLACK,lw)

              save(im,path)

          p=os.path.join(IMG,"mainBgImage@3x.png")
          if os.path.exists(p):
              make_main_bg(p)

          p=os.path.join(IMG,"chatroomBgImage@3x.png")
          if os.path.exists(p):
              make_chat_bg(p)

          # =====================================================
          # V5 bubble
          #
          # Target:
          # - pill-like
          # - rounder corners
          # - low ears
          # - wider by design
          # - Jiwoong much smaller and moved inward
          # =====================================================

          def bubble(path):
              src=open_rgba(path)
              w,h=src.size
              name=os.path.basename(path)

              send="Send" in name
              selected="Selected" in name
              first="01" in name

              den=density(path)

              im=Image.new(
                  "RGBA",
                  (w,h),
                  (0,0,0,0)
              )

              d=ImageDraw.Draw(im)

              if send:
                  fill=(48,48,48,255) if selected else BLACK
                  edge=fill
              else:
                  fill=(244,244,244,255) if selected else WHITE
                  edge=BLACK

              stroke=max(2,den*2)

              # lower overall body
              if first:
                  top=int(h*.24)
              else:
                  top=int(h*.10)

              left=max(2,den)
              right=w-left
              bottom=h-max(2,den)

              # much rounder
              radius=max(
                  14,
                  int(min(w,h)*.31)
              )

              d.rounded_rectangle(
                  (left,top,right,bottom),
                  radius=radius,
                  fill=fill,
                  outline=edge,
                  width=stroke
              )

              # low cat ears
              ear_h=int(
                  h*.11 if first else h*.085
              )
              ear_w=int(w*.18)

              lx=left+radius*.48
              rx=right-radius*.48

              left_ear=[
                  (lx,top+stroke),
                  (lx+ear_w*.46,top-ear_h),
                  (lx+ear_w,top+stroke)
              ]

              right_ear=[
                  (rx-ear_w,top+stroke),
                  (rx-ear_w*.54,top-ear_h),
                  (rx,top+stroke)
              ]

              d.polygon(left_ear,fill=fill)
              d.polygon(right_ear,fill=fill)

              d.line(
                  left_ear,
                  fill=edge,
                  width=stroke,
                  joint="curve"
              )

              d.line(
                  right_ear,
                  fill=edge,
                  width=stroke,
                  joint="curve"
              )

              # hide base seam
              d.line(
                  (lx+stroke,top+stroke,lx+ear_w-stroke,top+stroke),
                  fill=fill,
                  width=stroke+3
              )

              d.line(
                  (rx-ear_w+stroke,top+stroke,rx-stroke,top+stroke),
                  fill=fill,
                  width=stroke+3
              )

              # Jiwoong only on 01
              if first and HEAD is not None:
                  hh=HEAD.copy()

                  # smaller than V4 to avoid crop
                  hh.thumbnail(
                      (
                          int(w*.32),
                          int(h*.26)
                      ),
                      Image.Resampling.LANCZOS
                  )

                  y=max(
                      0,
                      int(top-hh.height*.72)
                  )

                  if send:
                      x=int(w-hh.width-den*3)
                  else:
                      x=int(den*3)

                  paste_sticker(
                      im,
                      hh,
                      x,
                      y,
                      max(2,den)
                  )

              save(im,path)

          for p in glob.glob(
              os.path.join(IMG,"chatroomBubble*.png")
          ):
              bubble(p)

          # =====================================================
          # tab icons
          # =====================================================

          def tab_icon(path):
              old=open_rgba(path)
              w,h=old.size
              name=os.path.basename(path)

              im=Image.new(
                  "RGBA",
                  (w,h),
                  (0,0,0,0)
              )

              d=ImageDraw.Draw(im)

              s=min(w,h)*.74

              if "Friends" in name:
                  penguin(d,w/2,h/2,s)

              elif "Chats" in name:
                  tiger(d,w/2,h/2,s)

              elif "Now" in name or "Call" in name:
                  black_cat(d,w/2,h/2,s)

              elif "Shopping" in name or "Piccoma" in name:
                  butterfly(
                      d,
                      w/2,
                      h/2,
                      s*.80,
                      max(2,int(s*.035))
                  )

              elif "More" in name:
                  if HEAD is not None:
                      hh=HEAD.copy()

                      # use center face crop, not giant wide sticker
                      hw,hh0=hh.size

                      # keep center
                      left=max(0,int(hw*.20))
                      right=min(hw,int(hw*.80))

                      face=hh.crop(
                          (
                              left,
                              0,
                              right,
                              hh0
                          )
                      )

                      face.thumbnail(
                          (
                              int(w*.70),
                              int(h*.70)
                          ),
                          Image.Resampling.LANCZOS
                      )

                      im.alpha_composite(
                          face,
                          (
                              (w-face.width)//2,
                              (h-face.height)//2
                          )
                      )
                  else:
                      heart(
                          d,
                          w/2,
                          h/2,
                          s*.5,
                          BLACK,
                          max(2,int(s*.05))
                      )

              else:
                  heart(
                      d,
                      w/2,
                      h/2,
                      s*.5,
                      BLACK,
                      max(2,int(s*.05))
                  )

              save(im,path)

          for p in glob.glob(
              os.path.join(IMG,"maintabIco*.png")
          ):
              tab_icon(p)

          # =====================================================
          # tab bg
          # =====================================================

          for p in glob.glob(
              os.path.join(IMG,"maintabBgImage@*.png")
          ):
              old=open_rgba(p)
              w,h=old.size

              im=Image.new(
                  "RGBA",
                  (w,h),
                  WHITE
              )

              d=ImageDraw.Draw(im)

              d.line(
                  (0,1,w,1),
                  fill=(30,30,30,55),
                  width=max(1,h//45)
              )

              save(im,p)

          # =====================================================
          # profile placeholder
          # =====================================================

          profile=os.path.join(
              IMG,
              "profileImg01@3x.png"
          )

          if os.path.exists(profile):
              old=open_rgba(profile)
              w,h=old.size

              im=Image.new(
                  "RGBA",
                  (w,h),
                  WHITE
              )

              d=ImageDraw.Draw(im)
              black_cat(
                  d,
                  w/2,
                  h/2,
                  min(w,h)*.74
              )

              save(im,profile)

          print("V5 assets generated.")
          PY

      - name: Update CSS V5
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          path=Path("theme/KakaoTalkTheme.css")

          css=path.read_text(
              encoding="utf-8",
              errors="ignore"
          )

          css=re.sub(
              r"-kakaotalk-theme-name:[^;]*;",
              "-kakaotalk-theme-name: 'JIWOONG BW V5';",
              css
          )

          css=re.sub(
              r"-kakaotalk-theme-id:[^;]*;",
              "-kakaotalk-theme-id: 'com.uo.jiwoong.bw.v5';",
              css
          )

          css=re.sub(
              r"-kakaotalk-author-name:[^;]*;",
              "-kakaotalk-author-name: 'UO';",
              css
          )

          css=css.replace("#FFDEDE","#FCFBF8")
          css=css.replace("#FFFCEE","#FCFBF8")
          css=css.replace("#FFF8DA","#FCFBF8")

          # ============================================
          # SEND
          # ============================================

          m=re.search(
              r"MessageCellStyle-Send\s*\{.*?\}",
              css,
              re.S
          )

          if m:
              block=m.group(0)

              block=re.sub(
                  r"-ios-title-edgeinsets:[^;]*;",
                  "-ios-title-edgeinsets: 22px 30px 10px 30px;",
                  block
              )

              block=re.sub(
                  r"-ios-group-title-edgeinsets:[^;]*;",
                  "-ios-group-title-edgeinsets: 10px 30px 10px 30px;",
                  block
              )

              block=re.sub(
                  r"-ios-text-color:[^;]*;",
                  "-ios-text-color: #FFFFFF;",
                  block
              )

              block=re.sub(
                  r"-ios-selected-text-color:[^;]*;",
                  "-ios-selected-text-color: #FFFFFF;",
                  block
              )

              block=re.sub(
                  r"-ios-unread-text-color:[^;]*;",
                  "-ios-unread-text-color: #D8D8D8;",
                  block
              )

              css=css[:m.start()]+block+css[m.end():]

          # ============================================
          # RECEIVE
          # ============================================

          m=re.search(
              r"MessageCellStyle-Receive\s*\{.*?\}",
              css,
              re.S
          )

          if m:
              block=m.group(0)

              block=re.sub(
                  r"-ios-title-edgeinsets:[^;]*;",
                  "-ios-title-edgeinsets: 22px 30px 10px 30px;",
                  block
              )

              block=re.sub(
                  r"-ios-group-title-edgeinsets:[^;]*;",
                  "-ios-group-title-edgeinsets: 10px 30px 10px 30px;",
                  block
              )

              block=re.sub(
                  r"-ios-text-color:[^;]*;",
                  "-ios-text-color: #171717;",
                  block
              )

              block=re.sub(
                  r"-ios-selected-text-color:[^;]*;",
                  "-ios-selected-text-color: #171717;",
                  block
              )

              block=re.sub(
                  r"-ios-unread-text-color:[^;]*;",
                  "-ios-unread-text-color: #777777;",
                  block
              )

              css=css[:m.start()]+block+css[m.end():]

          path.write_text(
              css,
              encoding="utf-8"
          )

          print("V5 CSS done.")
          PY

      - name: Package
        shell: bash
        run: |
          set -e

          rm -f JIWOONG_BW.ktheme

          cd theme
          zip -q -r ../JIWOONG_BW.ktheme .
          cd ..

          unzip -t JIWOONG_BW.ktheme
          ls -lh JIWOONG_BW.ktheme

      - name: Commit V5
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add JIWOONG_BW.ktheme

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Build JIWOONG BW V5"
            git push
          fi