name: Inspect KakaoTalk Theme

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract original theme
        shell: bash
        run: |
          set -e
          rm -rf theme
          mkdir theme
          unzip -q mangdaeng.ktheme -d theme

      - name: Create file list
        shell: bash
        run: |
          set -e
          echo "=== ALL THEME FILES ===" > theme-file-list.txt
          find theme -type f | sort >> theme-file-list.txt

          echo "" >> theme-file-list.txt
          echo "=== IMAGE FILES ===" >> theme-file-list.txt
          find theme/Images -type f | sort >> theme-file-list.txt

          echo ""
          echo "Theme file list:"
          cat theme-file-list.txt

      - name: Commit file list
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add theme-file-list.txt

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Add KakaoTalk theme file list"
            git push
          fi