name: Build JIWOONG HEAD TEST

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y unzip zip
          python3 -m pip install --upgrade pip
          python3 -m pip install pillow rembg onnxruntime

      - name: Extract Mangdaeng base
        shell: bash
        run: |
          set -e

          rm -rf theme
          mkdir theme

          unzip -q mangdaeng.ktheme -d theme

          test -f theme/KakaoTalkTheme.css
          test -d theme/Images

      - name: Create Jiwoong transparent head
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from PIL import Image
          from rembg import remove
          from pathlib import Path

          # ==========================================================
          # SOURCE PHOTO
          # ==========================================================

          candidates = [
              Path("IMG_5895.png"),
              Path("IMG_5895.jpeg"),
              Path("IMG_5895.jpg"),
          ]

          source = None

          for p in candidates:
              if p.exists():
                  source = p
                  break

          if source is None:
              raise FileNotFoundError(
                  "Cannot find IMG_5895.png / jpeg / jpg"
              )

          im = Image.open(source).convert("RGBA")

          w, h = im.size

          print("Source:", source)
          print("Size:", im.size)

          # ==========================================================
          # CROP CENTER PERSON
          #
          # Keep white towel + entire face.
          # This intentionally keeps more area than V5.
          # ==========================================================

          left   = int(w * 0.335)
          right  = int(w * 0.665)

          top    = int(h * 0.015)
          bottom = int(h * 0.995)

          crop = im.crop(
              (
                  left,
                  top,
                  right,
                  bottom
              )
          )

          # ==========================================================
          # REMOVE BACKGROUND
          # ==========================================================

          cut = remove(
              crop,
              alpha_matting=True,
              alpha_matting_foreground_threshold=240,
              alpha_matting_background_threshold=15,
              alpha_matting_erode_size=5
          ).convert("RGBA")

          # ==========================================================
          # TIGHT ALPHA CROP
          # ==========================================================

          alpha = cut.getchannel("A")

          bbox = alpha.getbbox()

          if bbox:
              cut = cut.crop(bbox)

          # add transparent safety margin
          pad = max(
              12,
              int(cut.width * 0.045)
          )

          canvas = Image.new(
              "RGBA",
              (
                  cut.width + pad * 2,
                  cut.height + pad * 2
              ),
              (0, 0, 0, 0)
          )

          canvas.alpha_composite(
              cut,
              (
                  pad,
                  pad
              )
          )

          canvas.save(
              "jiwoong_head_test.png",
              "PNG"
          )

          print(
              "Head output:",
              canvas.size
          )
          PY

      - name: Build Jiwoong bubble assets
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          import os
          import glob

          IMG = Path("theme/Images")

          HEAD = Image.open(
              "jiwoong_head_test.png"
          ).convert("RGBA")

          BLACK = (18,18,18,255)
          WHITE = (255,255,255,255)

          # ==========================================================
          # IMPORTANT
          #
          # Only modify 01 bubbles.
          #
          # 02/group bubbles remain simple bubbles.
          #
          # The head is placed in the upper decorative zone where
          # Mangdaeng originally had its mascot.
          # ==========================================================

          def make_first_bubble(path):

              original = Image.open(path).convert("RGBA")

              w, h = original.size

              name = os.path.basename(path)

              send = "Send" in name
              selected = "Selected" in name

              scale = 3 if "@3x" in name else 2

              im = Image.new(
                  "RGBA",
                  (w, h),
                  (0,0,0,0)
              )

              d = ImageDraw.Draw(im)

              # ------------------------------------------------------
              # Bubble body
              # ------------------------------------------------------

              body_top = int(h * 0.39)

              margin = max(
                  2,
                  int(scale * 1.2)
              )

              radius = int(
                  min(w, h) * 0.19
              )

              if send:

                  fill = (
                      (43,43,43,255)
                      if selected
                      else BLACK
                  )

                  outline = fill

              else:

                  fill = (
                      (246,246,246,255)
                      if selected
                      else WHITE
                  )

                  outline = BLACK

              stroke = max(
                  2,
                  int(scale * 1.35)
              )

              d.rounded_rectangle(
                  (
                      margin,
                      body_top,
                      w-margin,
                      h-margin
                  ),
                  radius=radius,
                  fill=fill,
                  outline=outline,
                  width=stroke
              )

              # ------------------------------------------------------
              # CAT EARS
              #
              # Keep ears small in this test because HEAD is priority.
              # ------------------------------------------------------

              ear_h = int(h * 0.11)
              ear_w = int(w * 0.15)

              if send:

                  # ears toward left/middle because head is on right
                  centers = [
                      int(w * 0.25),
                      int(w * 0.48)
                  ]

              else:

                  # ears toward right/middle because head is on left
                  centers = [
                      int(w * 0.52),
                      int(w * 0.75)
                  ]

              for cx in centers:

                  pts = [
                      (
                          cx-ear_w//2,
                          body_top+2
                      ),
                      (
                          cx,
                          body_top-ear_h
                      ),
                      (
                          cx+ear_w//2,
                          body_top+2
                      )
                  ]

                  d.polygon(
                      pts,
                      fill=fill
                  )

                  d.line(
                      pts,
                      fill=outline,
                      width=stroke,
                      joint="curve"
                  )

                  # erase base seam
                  d.line(
                      (
                          cx-ear_w//2+stroke,
                          body_top+stroke,
                          cx+ear_w//2-stroke,
                          body_top+stroke
                      ),
                      fill=fill,
                      width=stroke+3
                  )

              # ------------------------------------------------------
              # JIWOONG HEAD
              #
              # Critical change:
              # head is entirely in the upper mascot/decorative zone.
              # We do NOT put the face inside the stretchable body.
              # ------------------------------------------------------

              target_h = int(h * 0.50)

              ratio = target_h / HEAD.height

              target_w = int(
                  HEAD.width * ratio
              )

              # prevent over-width
              max_w = int(w * 0.43)

              if target_w > max_w:

                  ratio = max_w / HEAD.width

                  target_w = max_w

                  target_h = int(
                      HEAD.height * ratio
                  )

              head = HEAD.resize(
                  (
                      target_w,
                      target_h
                  ),
                  Image.Resampling.LANCZOS
              )

              if send:

                  # right side, like target mockup
                  x = int(w * 0.95) - target_w

              else:

                  # left side
                  x = int(w * 0.05)

              # bottom of head overlaps bubble very slightly
              y = body_top - int(target_h * 0.82)

              # ensure no clipping
              x = max(
                  1,
                  min(
                      x,
                      w-target_w-1
                  )
              )

              y = max(
                  1,
                  min(
                      y,
                      h-target_h-1
                  )
              )

              im.alpha_composite(
                  head,
                  (
                      x,
                      y
                  )
              )

              im.save(
                  path,
                  "PNG",
                  optimize=True
              )

              print(
                  name,
                  "bubble:",
                  (w,h),
                  "head:",
                  (target_w,target_h),
                  "position:",
                  (x,y)
              )

          # ONLY FIRST MESSAGE BUBBLES
          patterns = [
              "chatroomBubbleSend01@2x.png",
              "chatroomBubbleSend01@3x.png",
              "chatroomBubbleSend01Selected@2x.png",
              "chatroomBubbleSend01Selected@3x.png",

              "chatroomBubbleReceive01@2x.png",
              "chatroomBubbleReceive01@3x.png",
              "chatroomBubbleReceive01Selected@2x.png",
              "chatroomBubbleReceive01Selected@3x.png",
          ]

          for filename in patterns:

              p = IMG / filename

              if p.exists():
                  make_first_bubble(p)

          print("Jiwoong HEAD TEST bubble assets complete.")
          PY

      - name: Update CSS
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path(
              "theme/KakaoTalkTheme.css"
          )

          css = p.read_text(
              encoding="utf-8",
              errors="ignore"
          )

          # ==========================================================
          # UNIQUE TEST THEME
          # ==========================================================

          css = re.sub(
              r"-kakaotalk-theme-name:[^;]*;",
              "-kakaotalk-theme-name: 'JIWOONG HEAD TEST';",
              css
          )

          css = re.sub(
              r"-kakaotalk-theme-id:[^;]*;",
              "-kakaotalk-theme-id: 'com.uo.jiwoong.headtest1';",
              css
          )

          css = re.sub(
              r"-kakaotalk-author-name:[^;]*;",
              "-kakaotalk-author-name: 'UO';",
              css
          )

          # ==========================================================
          # SEND TEXT
          # ==========================================================

          m = re.search(
              r"MessageCellStyle-Send\s*\{.*?\}",
              css,
              re.S
          )

          if m:

              block = m.group(0)

              block = re.sub(
                  r"-ios-title-edgeinsets:[^;]*;",
                  "-ios-title-edgeinsets: 31px 28px 10px 28px;",
                  block
              )

              block = re.sub(
                  r"-ios-text-color:[^;]*;",
                  "-ios-text-color: #FFFFFF;",
                  block
              )

              block = re.sub(
                  r"-ios-selected-text-color:[^;]*;",
                  "-ios-selected-text-color: #FFFFFF;",
                  block
              )

              css = (
                  css[:m.start()]
                  + block +
                  css[m.end():]
              )

          # ==========================================================
          # RECEIVE TEXT
          # ==========================================================

          m = re.search(
              r"MessageCellStyle-Receive\s*\{.*?\}",
              css,
              re.S
          )

          if m:

              block = m.group(0)

              block = re.sub(
                  r"-ios-title-edgeinsets:[^;]*;",
                  "-ios-title-edgeinsets: 31px 28px 10px 28px;",
                  block
              )

              block = re.sub(
                  r"-ios-text-color:[^;]*;",
                  "-ios-text-color: #171717;",
                  block
              )

              block = re.sub(
                  r"-ios-selected-text-color:[^;]*;",
                  "-ios-selected-text-color: #171717;",
                  block
              )

              css = (
                  css[:m.start()]
                  + block +
                  css[m.end():]
              )

          p.write_text(
              css,
              encoding="utf-8"
          )

          print("HEAD TEST CSS complete.")
          PY

      - name: Package theme
        shell: bash
        run: |
          set -e

          rm -f JIWOONG_HEAD_TEST.ktheme

          cd theme

          zip -q -r ../JIWOONG_HEAD_TEST.ktheme .

          cd ..

          unzip -t JIWOONG_HEAD_TEST.ktheme

          ls -lh JIWOONG_HEAD_TEST.ktheme

      - name: Publish test theme
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add JIWOONG_HEAD_TEST.ktheme

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Build Jiwoong head test"
            git push
          fi